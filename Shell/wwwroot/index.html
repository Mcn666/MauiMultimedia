<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MauiMultimedia.Shell</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="MauiMultimedia.Shell.styles.css" />
    <link rel="icon" href="data:,">
    <script>
        (function () {
            var saved = localStorage.getItem('filebrowser-theme');
            var dark;
            if (saved === 'dark') dark = true;
            else if (saved === 'light') dark = false;
            else {
                // "system" 模式：优先读 Home.razor 存好的解析值
                var resolved = localStorage.getItem('filebrowser-theme-resolved');
                if (resolved === 'dark') dark = true;
                else if (resolved === 'light') dark = false;
                else {
                    // matchMedia 在 Android WebView 早期加载时不可靠，不作为强制依据
                    // 让 CSS @media (prefers-color-scheme) 自行处理，不设内联背景
                    return;
                }
            }

            var bg = dark ? '#1e1e1e' : '#ffffff';
            document.documentElement.style.background = bg;
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            // 永久开启主题过渡能力（实际过渡在切换主题时由 theme-switching 类触发，避免拖慢 hover）
            document.documentElement.classList.add('allow-transition');
        })();

        // 通过 DotNetStreamReference 创建 blob URL
        window.createBlobUrl = async function (streamRef, mimeType) {
            const ab = await streamRef.arrayBuffer();
            const blob = new Blob([ab], { type: mimeType });
            return URL.createObjectURL(blob);
        };
        window.revokeBlobUrl = function (url) {
            URL.revokeObjectURL(url);
        };

        // 上下文菜单：注册 window 级 scroll/resize 监听，触发即通知 Blazor 关闭。
        // 用于修复「菜单打开后滚动列表，菜单 fixed 钉在原坐标不走」的问题。
        window.ctxMenuDismiss = (function () {
            var h = null;
            return {
                attach: function (ref) {
                    h = function () { ref.invokeMethodAsync('CloseContextMenu'); };
                    window.addEventListener('scroll', h, true);
                    window.addEventListener('resize', h, true);
                },
                detach: function () {
                    if (h) {
                        window.removeEventListener('scroll', h, true);
                        window.removeEventListener('resize', h, true);
                        h = null;
                    }
                }
            };
        })();
    </script>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app" style="opacity:0;transition:opacity .2s ease"></div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 检测 flex-gap 支持（Chrome < 84 不支持 flex 中的 gap）
            // 注意：子元素必须有宽度，否则 getBoundingClientRect 始终为 0
            (function () {
                var d = document.createElement('div');
                d.style.cssText = 'display:flex;gap:1px';
                d.innerHTML = '<div style="width:10px;height:1px"></div><div style="width:10px;height:1px"></div>';
                document.body.appendChild(d);
                var r1 = d.children[0].getBoundingClientRect();
                var r2 = d.children[1].getBoundingClientRect();
                if (Math.round(r2.left) <= Math.round(r1.right))
                    document.documentElement.classList.add('no-flex-gap');
                document.body.removeChild(d);
            })();

            // 检测 color-mix 支持（Chrome < 111 不支持）
            if (CSS && CSS.supports && CSS.supports('color', 'color-mix(in srgb, red, blue)'))
                document.documentElement.classList.add('color-mix');

            // 软键盘处理：让弹窗内的输入框始终保持在键盘之上（原生般体验）。
            // 依据 visualViewport 真实可视区域做几何位移，不依赖 pointer 类型判断——
            // 桌面端无键盘时输入框永远在可视区内，天然不会上移；
            // 移动端键盘遮住输入框底部时，自动把弹窗上推露出输入框。
            var kbdOverlay = null;
            var kbdInput = null;

            function adjustForKeyboard() {
                if (!kbdInput || !kbdOverlay) return;
                var vv = window.visualViewport;
                var visibleTop = vv ? vv.offsetTop : 0;
                var visibleBottom = vv ? (vv.offsetTop + vv.height) : window.innerHeight;
                var r = kbdInput.getBoundingClientRect();
                var pad = 12;
                // 输入框底部超出可视区 → 上移（负值）
                var shift = 0;
                if (r.bottom > visibleBottom - pad) {
                    shift = visibleBottom - pad - r.bottom;
                }
                // 上移后顶部被顶出可视区 → 补正，确保输入框顶部也可见
                if (r.top + shift < visibleTop + pad) {
                    shift = visibleTop + pad - r.top;
                }
                kbdOverlay.style.transform = shift !== 0 ? 'translateY(' + shift + 'px)' : '';
            }

            document.addEventListener('focusin', function (e) {
                var el = e.target;
                if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return;
                var overlay = el.closest('.picker-overlay');
                if (!overlay) return;
                kbdInput = el;
                kbdOverlay = overlay;
                // 键盘弹出有动画，等稳定后再测量一次；后续 resize/scroll 会持续校正
                setTimeout(adjustForKeyboard, 300);
            });

            document.addEventListener('focusout', function (e) {
                var overlay = e.target.closest && e.target.closest('.picker-overlay');
                if (overlay) overlay.style.transform = '';
                kbdInput = null;
                kbdOverlay = null;
            });

            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', adjustForKeyboard);
                window.visualViewport.addEventListener('scroll', adjustForKeyboard);
            }

            const obs = new IntersectionObserver(async (entries) => {
                for (const e of entries) {
                    if (!e.isIntersecting) continue;
                    const el = e.target;
                    obs.unobserve(el);
                    const path = el.getAttribute('data-thumb-path');
                    if (!path) continue;
                    // 数据驱动：快照程序集/方法由查看器元数据提供（data-thumb-asm/-method），
                    // Shell 不再硬编码扩展名→程序集路由（零侵入）。
                    const asm = el.getAttribute('data-thumb-asm');
                    const method = el.getAttribute('data-thumb-method');
                    if (!asm || !method) { el.removeAttribute('data-thumb-path'); continue; }
                    try {
                        const uri = await DotNet.invokeMethodAsync(asm, method, path);
                        if (uri) {
                            // 直接替换 DOM，不走 Blazor 重绘，彻底消除闪烁
                            const label = el.querySelector('.grid-thumb-label');
                            el.innerHTML = '<img src="' + uri.replace(/"/g, '&quot;')
                                + '" class="grid-thumb-img" alt="" loading="lazy" />'
                                + (label ? label.outerHTML : '');
                            el.removeAttribute('data-thumb-path');
                        } else {
                            // 取帧失败（不支持的编码/平台）：移除标记，避免反复重试
                            el.removeAttribute('data-thumb-path');
                        }
                    } catch (err) {
                        el.removeAttribute('data-thumb-path');
                    }
                }
            }, { rootMargin: '100px' });
            const scan = () => document.querySelectorAll('[data-thumb-path]')
                .forEach(el => obs.observe(el));
            scan();
            new MutationObserver(scan).observe(document.body, { childList: true, subtree: true });
        });
    </script>
    <!--<script src="_framework/blazor.webview.js" autostart="false"></script>-->
    <script src="scripts/blazor.webview.improved.js" autostart="false"></script>
</body>

</html>
