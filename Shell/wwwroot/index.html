<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MauiMultimedia.Shell</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="MauiMultimedia.Shell.styles.css" />
    <link rel="icon" href="data:,">
    <style>
        /* 默认深色背景，防止 Android WebView 白色闪烁。内联脚本会立刻纠正为正确值 */
        :root {
            background: #1e1e1e;
        }

        @media (prefers-color-scheme: light) {
            :root {
                background: #ffffff;
            }
        }
    </style>
    <script>
        (function () {
            var saved = localStorage.getItem('filebrowser-theme');
            var dark;
            if (saved === 'dark') dark = true;
            else if (saved === 'light') dark = false;
            else {
                // "system" 模式：优先读 Home.razor 存好的解析值
                var resolved = localStorage.getItem('filebrowser-theme-resolved');
                if (resolved === 'dark') dark = true;
                else if (resolved === 'light') dark = false;
                else {
                    // matchMedia 在 Android WebView 早期加载时不可靠，不作为强制依据
                    // 让 CSS @media (prefers-color-scheme) 自行处理，不设内联背景
                    return;
                }
            }

            var bg = dark ? '#1e1e1e' : '#ffffff';
            document.documentElement.style.background = bg;
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();

        // 通过 DotNetStreamReference 创建 blob URL
        window.createBlobUrl = async function (streamRef, mimeType) {
            const ab = await streamRef.arrayBuffer();
            const blob = new Blob([ab], { type: mimeType });
            return URL.createObjectURL(blob);
        };
        window.revokeBlobUrl = function (url) {
            URL.revokeObjectURL(url);
        };
    </script>
</head>

<body style="background:#1e1e1e;margin:0;">

    <div class="status-bar-safe-area"></div>

    <div id="app" style="opacity:0;transition:opacity .2s ease"></div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 检测 flex-gap 支持（Chrome < 84 不支持 flex 中的 gap）
            // 注意：子元素必须有宽度，否则 getBoundingClientRect 始终为 0
            (function () {
                var d = document.createElement('div');
                d.style.cssText = 'display:flex;gap:1px';
                d.innerHTML = '<div style="width:10px;height:1px"></div><div style="width:10px;height:1px"></div>';
                document.body.appendChild(d);
                var r1 = d.children[0].getBoundingClientRect();
                var r2 = d.children[1].getBoundingClientRect();
                if (Math.round(r2.left) <= Math.round(r1.right))
                    document.documentElement.classList.add('no-flex-gap');
                document.body.removeChild(d);
            })();

            // 检测 color-mix 支持（Chrome < 111 不支持）
            if (CSS && CSS.supports && CSS.supports('color', 'color-mix(in srgb, red, blue)'))
                document.documentElement.classList.add('color-mix');

            // Android 虚拟键盘：弹出时将 overlay 上移使输入框可见
            document.addEventListener('focusin', function (e) {
                var el = e.target;
                if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return;
                var overlay = el.closest('.picker-overlay');
                if (!overlay) return;
                setTimeout(function () {
                    // 尝试用 visualViewport 计算精确键盘高度
                    var vv = window.visualViewport;
                    var kbdH = vv ? window.innerHeight - vv.height : 0;
                    if (kbdH > 50) {
                        // 精确计算：输入框底部超出可视区域多少就上移多少
                        var r = el.getBoundingClientRect();
                        var overlap = r.bottom - (vv ? vv.height : window.innerHeight);
                        if (overlap > 0) {
                            overlay.style.setProperty('margin-top', (-overlap - 20) + 'px', 'important');
                            return;
                        }
                    }
                    // fallback: 直接上移 35%
                    overlay.style.setProperty('margin-top', '-35vh', 'important');
                }, 350);
            });
            document.addEventListener('focusout', function (e) {
                var overlay = e.target.closest('.picker-overlay');
                if (overlay) overlay.style.removeProperty('margin-top');
            });

            const obs = new IntersectionObserver(async (entries) => {
                for (const e of entries) {
                    if (!e.isIntersecting) continue;
                    const el = e.target;
                    obs.unobserve(el);
                    const path = el.getAttribute('data-thumb-path');
                    if (!path) continue;
                    // 数据驱动：快照程序集/方法由查看器元数据提供（data-thumb-asm/-method），
                    // Shell 不再硬编码扩展名→程序集路由（零侵入）。
                    const asm = el.getAttribute('data-thumb-asm');
                    const method = el.getAttribute('data-thumb-method');
                    if (!asm || !method) { el.removeAttribute('data-thumb-path'); continue; }
                    try {
                        const uri = await DotNet.invokeMethodAsync(asm, method, path);
                        if (uri) {
                            // 直接替换 DOM，不走 Blazor 重绘，彻底消除闪烁
                            const label = el.querySelector('.grid-thumb-label');
                            el.innerHTML = '<img src="' + uri.replace(/"/g, '&quot;')
                                + '" class="grid-thumb-img" alt="" loading="lazy" />'
                                + (label ? label.outerHTML : '');
                            el.removeAttribute('data-thumb-path');
                        } else {
                            // 取帧失败（不支持的编码/平台）：移除标记，避免反复重试
                            el.removeAttribute('data-thumb-path');
                        }
                    } catch (err) {
                        el.removeAttribute('data-thumb-path');
                    }
                }
            }, { rootMargin: '100px' });
            const scan = () => document.querySelectorAll('[data-thumb-path]')
                .forEach(el => obs.observe(el));
            scan();
            new MutationObserver(scan).observe(document.body, { childList: true, subtree: true });
        });
    </script>
    <!--<script src="_framework/blazor.webview.js" autostart="false"></script>-->
    <script src="scripts/blazor.webview.improved.js" autostart="false"></script>
</body>

</html>
