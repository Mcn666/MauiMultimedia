<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MauiMultimedia.Shell</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="MauiMultimedia.Shell.styles.css" />
    <link rel="icon" href="data:,">
    <style>
        /* 默认背景色（在 JS 执行前使用） */
        :root { background: #ffffff; }
    </style>
    <script>
        (function() {
            var saved = localStorage.getItem('filebrowser-theme');
            var dark;
            if (saved === 'dark') dark = true;
            else if (saved === 'light') dark = false;
            else dark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            var bg = dark ? '#1a1a1a' : '#ffffff';
            document.documentElement.style.background = bg;
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();

        // 通过 DotNetStreamReference 创建 blob URL
        window.createBlobUrl = async function(streamRef, mimeType) {
            const ab = await streamRef.arrayBuffer();
            const blob = new Blob([ab], { type: mimeType });
            return URL.createObjectURL(blob);
        };
    </script>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app" style="opacity:0;transition:opacity .2s ease"></div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const obs = new IntersectionObserver(async (entries) => {
                for (const e of entries) {
                    if (!e.isIntersecting) continue;
                    const el = e.target;
                    obs.unobserve(el);
                    const path = el.getAttribute('data-thumb-path');
                    if (!path) continue;
                    try {
                        const uri = await DotNet.invokeMethodAsync(
                            'MauiMultimedia.Viewers.Image', 'generateSnapshot', path);
                        if (uri) {
                            // 直接替换 DOM，不走 Blazor 重绘，彻底消除闪烁
                            const label = el.querySelector('.grid-thumb-label');
                            el.innerHTML = '<img src="' + uri.replace(/"/g, '&quot;')
                                + '" class="grid-thumb-img" alt="" loading="lazy" />'
                                + (label ? label.outerHTML : '');
                            el.removeAttribute('data-thumb-path');
                        }
                    } catch (err) { }
                }
            }, { rootMargin: '100px' });
            const scan = () => document.querySelectorAll('[data-thumb-path]')
                .forEach(el => obs.observe(el));
            scan();
            new MutationObserver(scan).observe(document.body, { childList: true, subtree: true });
        });
    </script>
    <!--<script src="_framework/blazor.webview.js" autostart="false"></script>-->
    <script src="scripts/blazor.webview.es2019.js" autostart="false"></script>


</body>

</html>
