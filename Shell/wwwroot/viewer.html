<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Viewer</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="MauiMultimedia.Shell.styles.css" />
    <script>
        (function() {
            var s = localStorage.getItem('filebrowser-theme');
            var d;
            if (s === 'dark') d = true;
            else if (s === 'light') d = false;
            else d = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        })();

        window.createBlobUrl = async function(streamRef, mimeType) {
            const ab = await streamRef.arrayBuffer();
            const blob = new Blob([ab], { type: mimeType });
            return URL.createObjectURL(blob);
        };
    </script>
</head>
<body>
    <div id="app">Loading...</div>
    <div id="blazor-error-ui" class="blazor-error">An error occurred.</div>
    <script src="scripts/blazor.webview.es2019.js" autostart="false"></script>
</body>
</html>
