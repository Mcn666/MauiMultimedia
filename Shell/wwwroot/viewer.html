<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Viewer</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="MauiMultimedia.Shell.styles.css" />
    <style>
        :root { background: #1a1a1a; }
        @media (prefers-color-scheme: light) {
            :root { background: #ffffff; }
        }
    </style>
    <script>
        (function() {
            var saved = localStorage.getItem('filebrowser-theme');
            var dark;
            if (saved === 'dark') dark = true;
            else if (saved === 'light') dark = false;
            else {
                var resolved = localStorage.getItem('filebrowser-theme-resolved');
                if (resolved === 'dark') dark = true;
                else if (resolved === 'light') dark = false;
                else dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
            document.documentElement.style.background = dark ? '#1a1a1a' : '#ffffff';
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();

        window.createBlobUrl = async function(streamRef, mimeType) {
            const ab = await streamRef.arrayBuffer();
            const blob = new Blob([ab], { type: mimeType });
            return URL.createObjectURL(blob);
        };
    </script>
</head>
<body>
    <div id="app">Loading...</div>
    <div id="blazor-error-ui" class="blazor-error">An error occurred.</div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var d = document.createElement('div');
            d.style.cssText = 'display:flex;gap:1px';
            d.innerHTML = '<div style="width:10px;height:1px"></div><div style="width:10px;height:1px"></div>';
            document.body.appendChild(d);
            var r1 = d.children[0].getBoundingClientRect();
            var r2 = d.children[1].getBoundingClientRect();
            if (Math.round(r2.left) <= Math.round(r1.right))
                document.documentElement.classList.add('no-flex-gap');
            document.body.removeChild(d);

            // 检测 color-mix 支持（Chrome < 111 不支持）
            if (CSS && CSS.supports && CSS.supports('color', 'color-mix(in srgb, red, blue)'))
                document.documentElement.classList.add('color-mix');

            // Android 虚拟键盘：弹出时将 overlay 上移使输入框可见
            document.addEventListener('focusin', function(e) {
                var el = e.target;
                if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return;
                var overlay = el.closest('.picker-overlay');
                if (!overlay) return;
                setTimeout(function() {
                    var vv = window.visualViewport;
                    var kbdH = vv ? window.innerHeight - vv.height : 0;
                    if (kbdH > 50) {
                        var r = el.getBoundingClientRect();
                        var overlap = r.bottom - (vv ? vv.height : window.innerHeight);
                        if (overlap > 0) {
                            overlay.style.setProperty('margin-top', (-overlap - 20) + 'px', 'important');
                            return;
                        }
                    }
                    overlay.style.setProperty('margin-top', '-35vh', 'important');
                }, 350);
            });
            document.addEventListener('focusout', function(e) {
                var overlay = e.target.closest('.picker-overlay');
                if (overlay) overlay.style.removeProperty('margin-top');
            });
        });
    </script>
    <script src="scripts/blazor.webview.improved.js" autostart="false"></script>
    <script src="scripts/three.min.js"></script>
    <script src="scripts/STLLoader.js"></script>
    <script src="scripts/OBJLoader.js"></script>
    <script src="scripts/OrbitControls.js"></script>
    <script type="module" src="scripts/model-viewer.min.js"></script>
</body>
</html>
